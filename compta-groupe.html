<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Comptabilité du groupe — Menko Holding</title>
<style>
  /* Lecture seule : aucune écriture, aucune saisie. Même habillage que le hub. */
  :root {
    --or:#B87333; --or-light:#D4956A; --or-dark:#8B5520;
    --ardoise:#1C1C2E; --bg:#EDEDF2; --card:#fff; --bord:#E0E0EA; --dim:#55557F;
    --ok:#2a7a4a; --ok-bg:#e3f3ea; --warn:#a15c00; --warn-bg:#fdf0d8; --ko:#b3261e; --ko-bg:#fbe4e2; --off:#6b6b86; --off-bg:#ececf3;
  }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',Arial,sans-serif; }
  body { background:var(--bg); color:var(--ardoise); min-height:100vh; }
  header { background:linear-gradient(135deg,var(--ardoise),#3a2a1c); color:#fff; padding:1.1rem 2rem 2.2rem; }
  header .in { max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; flex-wrap:wrap; }
  header h1 { font-family:Georgia,'Times New Roman',serif; font-size:1.4rem; }
  header p { color:#c9c9da; font-size:.85rem; margin-top:.25rem; }
  .back { color:#fff; text-decoration:none; border:1px solid rgba(255,255,255,.35); padding:.45rem .9rem; border-radius:8px; font-size:.85rem; }
  .back:hover, .back:focus-visible { background:rgba(255,255,255,.12); outline:none; }
  main { max-width:1200px; margin:-1rem auto 0; padding:0 2rem 2.5rem; display:flex; flex-direction:column; gap:1.2rem; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; background:var(--card); border:1px solid var(--bord); border-radius:14px; padding:.8rem 1.1rem; }
  .bar label { font-size:.8rem; color:var(--dim); font-weight:600; display:flex; align-items:center; gap:.5rem; }
  select { padding:.45rem .7rem; border:1px solid var(--bord); border-radius:8px; font-size:.85rem; background:#fff; color:var(--ardoise); }
  select:focus-visible { outline:2px solid var(--or); outline-offset:1px; }
  .ro { font-size:.78rem; color:var(--dim); }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:.8rem; }
  .kpi { background:var(--card); border:1px solid var(--bord); border-radius:14px; padding:.9rem 1rem; min-width:0; }
  .kpi small { display:block; color:var(--dim); font-size:.7rem; text-transform:uppercase; letter-spacing:.5px; }
  .kpi b { display:block; font-family:Georgia,serif; font-size:1.45rem; margin-top:.15rem; font-variant-numeric:tabular-nums; }
  .kpi.ok b { color:var(--ok); } .kpi.ko b { color:var(--ko); } .kpi.wa b { color:var(--warn); }
  h2 { font-size:1.05rem; margin-top:.4rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1rem; }
  .card { background:var(--card); border:1px solid var(--bord); border-radius:14px; padding:1rem 1.1rem; min-width:0; }
  .card.act { border-top:5px solid var(--c,#B87333); display:flex; flex-direction:column; gap:.5rem; }
  .card .hd { display:flex; justify-content:space-between; align-items:center; gap:.6rem; }
  .card p, .mu { font-size:.8rem; color:var(--dim); }
  .badge { font-size:.7rem; font-weight:700; padding:.2rem .6rem; border-radius:99px; white-space:nowrap; }
  .badge.ok { background:var(--ok-bg); color:var(--ok); } .badge.ko { background:var(--ko-bg); color:var(--ko); } .badge.mu { background:var(--off-bg); color:var(--off); }
  .tw { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.84rem; }
  th { text-align:left; color:var(--dim); font-size:.68rem; text-transform:uppercase; letter-spacing:.5px; padding:.45rem .55rem; border-bottom:1px solid var(--bord); white-space:nowrap; }
  td { padding:.55rem; border-bottom:1px solid var(--bord); vertical-align:top; }
  th.n, td.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  td.neg { color:var(--ko); } td.pos { color:var(--ok); }
  .vide, .refus { background:var(--card); border:1px dashed var(--bord); border-radius:14px; padding:1.4rem; color:var(--dim); text-align:center; }
  footer { text-align:center; color:var(--dim); font-size:.75rem; padding:1.2rem; }
  @media (max-width:640px){ header{padding:1rem 1rem 2rem;} main{padding:0 1rem 2rem;} }
</style>
</head>
<body>
<header><div class="in">
  <div><h1>📒 Comptabilité du groupe</h1><p>Contrôle d'intégrité et résultat par activité · SYSCOHADA révisé · <span id="date"></span></p></div>
  <a class="back" href="index.html">← Hub du groupe</a>
</div></header>
<main id="app"><div class="vide">Chargement des écritures…</div></main>
<footer>Menko Holding — Côte d'Ivoire · lecture seule</footer>

<script>
'use strict';
const SESSION_KEY = 'menko_session', HUB_ROLES_KEY = 'menko_hub_roles';
const ACTIVITES = [
  { k:'immo',     nom:'Menko Immo',     ic:'🏗️', c:'#8B5520' },
  { k:'agro',     nom:'Menko Agro',     ic:'🌾', c:'#2f6b4a' },
  { k:'digitech', nom:'Menko Digitech', ic:'💻', c:'#1C1C2E' }
];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => new Intl.NumberFormat('fr-FR').format(Math.round(n || 0)).replace(/[  ]/g, ' ');
const fcfa = n => fmt(n) + ' F';

/* ── Accès : session ouverte au hub, administrateur ou rôle rattaché à une activité ── */
function accesAutorise(){
  let u = {}; try { u = JSON.parse(localStorage.getItem(SESSION_KEY) || '{}'); } catch(e){}
  if (!u || !u.role) return false;
  if (u.role === 'admin') return true;
  try { const r = JSON.parse(localStorage.getItem(HUB_ROLES_KEY) || '{}')[u.role]; return !!(r && (r.activites || []).length); } catch(e){ return false; }
}

/* ── Lecture IndexedDB, jamais d'écriture ── */
function lireStores(dbName, stores){
  return new Promise(res => {
    const out = {}; stores.forEach(s => out[s] = []);
    let req; try { req = indexedDB.open(dbName); } catch(e){ return res({ ok:false, out }); }
    req.onsuccess = e => {
      const db = e.target.result; let n = 0;
      const fin = () => { if (++n === stores.length) { db.close(); res({ ok:true, out }); } };
      stores.forEach(s => {
        if (!db.objectStoreNames.contains(s)) return fin();
        try { db.transaction(s,'readonly').objectStore(s).getAll().onsuccess = ev => { out[s] = ev.target.result || []; fin(); }; } catch(err){ fin(); }
      });
    };
    req.onerror = () => res({ ok:false, out });
    req.onupgradeneeded = e => { e.target.transaction.abort(); res({ ok:false, out }); };
  });
}
function lireKV(dbName){
  return new Promise(res => {
    let req; try { req = indexedDB.open(dbName); } catch(e){ return res({}); }
    req.onsuccess = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('kv')) { db.close(); return res({}); }
      db.transaction('kv','readonly').objectStore('kv').get('data').onsuccess = ev => { db.close(); res((ev.target.result && ev.target.result.v) || {}); };
    };
    req.onerror = () => res({});
    req.onupgradeneeded = e => { e.target.transaction.abort(); res({}); };
  });
}

/* ── Normalisation : une écriture → lignes {compte, d, c} ── */
function lignesDe(e){
  if (Array.isArray(e.lignes) && e.lignes.length) {
    return e.lignes.map(l => {
      const m = Number(l.montant) || 0;
      const d = l.sens ? (l.sens === 'D' ? m : 0) : (Number(l.debit) || 0);
      const c = l.sens ? (l.sens === 'C' ? m : 0) : (Number(l.credit) || 0);
      return { compte: String(l.compte == null ? '' : l.compte).trim(), d, c };
    });
  }
  /* Ancien format : un compte débité, un compte crédité, un montant (équilibré par construction) */
  const m = Number(e.montant) || 0;
  return [
    { compte: String(e.compte_debit || e.compte || '').trim(), d:m, c:0 },
    { compte: String(e.compte_credit || '').trim(), d:0, c:m }
  ];
}
const compteValide = c => /^[1-9]\d+$/.test(c);   // plan SYSCOHADA : classes 1 à 9
const dateValide = s => {
  const m = /^(\d{4})-(\d{2})-(\d{2})(?:$|[T ])/.exec(String(s || ''));
  return !!m && +m[1] >= 2000 && +m[1] <= new Date().getFullYear() + 1 && +m[2] >= 1 && +m[2] <= 12 && +m[3] >= 1 && +m[3] <= 31;
};

/* Résultat SYSCOHADA : produits = classe 7 + 82/84/86/88 ; charges = classe 6 + 81/83/85/87/89. */
const HAO_P = ['82','84','86','88'], HAO_C = ['81','83','85','87'];
function analyser(ecritures){
  const r = { nb:0, debit:0, credit:0, desequilibres:[], sansCompte:[], montantNul:[], hors:[], dateKo:[], exercices:new Set() };
  ecritures.forEach(e => {
    r.nb++;
    const L = lignesDe(e);
    const D = L.reduce((s,l)=>s+l.d,0), C = L.reduce((s,l)=>s+l.c,0);
    r.debit += D; r.credit += C;
    const info = { id:e.id, date:e.date, libelle:e.libelle || e.ref || '' };
    if (Math.abs(D - C) > 0.5) r.desequilibres.push(Object.assign({ detail:'Débit ' + fmt(D) + ' ≠ Crédit ' + fmt(C) }, info));
    if (L.some(l => !l.compte)) r.sansCompte.push(Object.assign({ detail:'Ligne sans compte' }, info));
    else if (L.some(l => !compteValide(l.compte))) r.hors.push(Object.assign({ detail:'Compte hors plan : ' + L.find(l => !compteValide(l.compte)).compte }, info));
    if (!(D > 0 || C > 0)) r.montantNul.push(Object.assign({ detail:'Montant nul' }, info));
    if (!dateValide(e.date)) r.dateKo.push(Object.assign({ detail:'Date invalide : ' + (e.date || '—') }, info));
    else r.exercices.add(String(e.date).slice(0,4));
  });
  return r;
}
function resultat(ecritures, annee, filtre){
  const t = { ord_p:0, ord_c:0, hao_p:0, hao_c:0, impot:0 };
  ecritures.forEach(e => {
    if (!dateValide(e.date) || String(e.date).slice(0,4) !== annee) return;
    if (filtre && !filtre(e)) return;
    lignesDe(e).forEach(l => {
      const c2 = l.compte.slice(0,2), c1 = l.compte.slice(0,1);
      if (c1 === '7') t.ord_p += l.c - l.d;
      else if (c1 === '6') t.ord_c += l.d - l.c;
      else if (HAO_P.includes(c2)) t.hao_p += l.c - l.d;
      else if (HAO_C.includes(c2)) t.hao_c += l.d - l.c;
      else if (c2 === '89') t.impot += l.d - l.c;
    });
  });
  t.rao = t.ord_p - t.ord_c; t.rhao = t.hao_p - t.hao_c; t.net = t.rao + t.rhao - t.impot;
  return t;
}
function statut(r){
  if (!r || !r.nb) return ['mu', 'Pas d\'écriture'];
  const pb = r.desequilibres.length + r.sansCompte.length + r.hors.length + r.montantNul.length + r.dateKo.length;
  return pb ? ['ko', 'À corriger'] : ['ok', 'Conforme'];
}

let DONNEES = null;
async function charger(){
  const [imm, agro, dig] = await Promise.all([
    lireStores('ImmoSuiteDB', ['ecritures','divisions']),
    lireKV('MenkoAgroDB'),
    lireKV('MenkoDigitechDB')
  ]);
  const divNom = {}; (imm.out.divisions || []).forEach(d => { divNom[d.id] = d.nom || d.libelle || d.id; });
  DONNEES = {
    immo:     { ecr: imm.out.ecritures, dispo: imm.ok },
    agro:     { ecr: Array.isArray(agro.ecritures) ? agro.ecritures : [], dispo: Object.keys(agro).length > 0 },
    digitech: { ecr: [], dispo: Object.keys(dig).length > 0, sansCompta:true },
    divNom
  };
  DONNEES.A = {};
  ACTIVITES.forEach(a => { DONNEES.A[a.k] = analyser(DONNEES[a.k].ecr); });
  const ans = new Set(); ACTIVITES.forEach(a => DONNEES.A[a.k].exercices.forEach(y => ans.add(y)));
  DONNEES.annees = Array.from(ans).sort().reverse();
  if (!DONNEES.annees.length) DONNEES.annees = [String(new Date().getFullYear())];
  DONNEES.annee = DONNEES.annees.includes(String(new Date().getFullYear())) ? String(new Date().getFullYear()) : DONNEES.annees[0];
}

function rendre(){
  const A = DONNEES.A, an = DONNEES.annee;
  const avec = ACTIVITES.filter(a => A[a.k].nb > 0);
  const tot = f => ACTIVITES.reduce((s,a) => s + f(A[a.k]), 0);
  const bad = ACTIVITES.filter(a => statut(A[a.k])[0] === 'ko').length;
  const anomalies = tot(r => r.desequilibres.length + r.sansCompte.length + r.hors.length + r.montantNul.length + r.dateKo.length);
  const D = tot(r => r.debit), C = tot(r => r.credit);

  let h = `<div class="bar"><label>Exercice (résultat)
      <select id="sel-an" aria-label="Exercice">${DONNEES.annees.map(y => `<option value="${esc(y)}"${y === an ? ' selected' : ''}>${esc(y)}</option>`).join('')}</select></label>
      <span class="ro">Lecture seule · données de cet appareil</span></div>`;

  h += `<div class="kpis">
    <div class="kpi ${avec.length ? 'ok' : 'wa'}"><small>Activités avec écritures</small><b>${avec.length} / ${ACTIVITES.length}</b></div>
    <div class="kpi"><small>Écritures</small><b>${fmt(tot(r => r.nb))}</b></div>
    <div class="kpi"><small>Total débit</small><b>${fcfa(D)}</b></div>
    <div class="kpi"><small>Total crédit</small><b>${fcfa(C)}</b></div>
    <div class="kpi ${Math.abs(D - C) > 0.5 ? 'ko' : 'ok'}"><small>Écart débit − crédit</small><b>${fcfa(D - C)}</b></div>
    <div class="kpi ${anomalies ? 'ko' : 'ok'}"><small>Anomalies à corriger</small><b>${fmt(anomalies)}</b></div></div>`;

  h += `<h2>Contrôle par activité</h2><div class="grid">` + ACTIVITES.map(a => {
    const r = A[a.k], s = statut(r), d = DONNEES[a.k];
    const msg = a.k === 'digitech' ? 'Pas de module comptable : facturation seulement.'
      : !d.dispo ? 'Aucune donnée sur cet appareil : ouvrez l\'application une fois.'
      : !r.nb ? 'Aucune écriture enregistrée.'
      : s[0] === 'ok' ? 'Toutes les écritures sont équilibrées et dans le plan.'
      : (r.desequilibres.length + r.sansCompte.length + r.hors.length + r.montantNul.length + r.dateKo.length) + ' anomalie(s) à corriger.';
    return `<div class="card act" style="--c:${a.c}"><div class="hd"><b>${a.ic} ${esc(a.nom)}</b><span class="badge ${s[0]}">${esc(s[1])}</span></div><p>${esc(msg)}</p></div>`;
  }).join('') + `</div>`;

  h += `<div class="card"><div class="tw"><table><thead><tr><th>Activité</th><th class="n">Écritures</th><th class="n">Débit</th><th class="n">Crédit</th><th class="n">Déséquilibrées</th><th class="n">Sans compte</th><th class="n">Hors plan</th><th class="n">Montant nul</th><th class="n">Date invalide</th></tr></thead><tbody>`
    + ACTIVITES.map(a => { const r = A[a.k]; const c = (x) => `<td class="n ${x ? 'neg' : ''}">${x}</td>`;
      return `<tr><td>${a.ic} ${esc(a.nom)}</td><td class="n">${fmt(r.nb)}</td><td class="n">${fcfa(r.debit)}</td><td class="n">${fcfa(r.credit)}</td>${c(r.desequilibres.length)}${c(r.sansCompte.length)}${c(r.hors.length)}${c(r.montantNul.length)}${c(r.dateKo.length)}</tr>`; }).join('')
    + `</tbody></table></div></div>`;

  /* Résultat par activité (SYSCOHADA) */
  const lignesRes = [];
  ACTIVITES.forEach(a => { if (A[a.k].nb) lignesRes.push({ lib:a.ic + ' ' + a.nom, r:resultat(DONNEES[a.k].ecr, an) }); });
  h += `<h2>Résultat par activité — exercice ${esc(an)}</h2>`;
  if (lignesRes.length) {
    const T = lignesRes.reduce((s,x) => { Object.keys(x.r).forEach(k => s[k] = (s[k] || 0) + x.r[k]); return s; }, {});
    const cl = v => v < 0 ? 'neg' : v > 0 ? 'pos' : '';
    const row = (lib, r, g) => `<tr>${g ? '<td><b>' + esc(lib) + '</b></td>' : '<td>' + esc(lib) + '</td>'}<td class="n">${fcfa(r.ord_p)}</td><td class="n">${fcfa(r.ord_c)}</td><td class="n ${cl(r.rao)}">${fcfa(r.rao)}</td><td class="n ${cl(r.rhao)}">${fcfa(r.rhao)}</td><td class="n">${fcfa(r.impot)}</td><td class="n ${cl(r.net)}"><b>${fcfa(r.net)}</b></td></tr>`;
    h += `<div class="card"><div class="tw"><table><thead><tr><th>Activité</th><th class="n">Produits (cl. 7)</th><th class="n">Charges (cl. 6)</th><th class="n">Résultat activités ordinaires</th><th class="n">Résultat HAO</th><th class="n">Impôt (89)</th><th class="n">Résultat net</th></tr></thead><tbody>`
      + lignesRes.map(x => row(x.lib, x.r)).join('') + (lignesRes.length > 1 ? row('Total agrégé', T, true) : '') + `</tbody></table></div>
      <p class="mu" style="margin-top:.6rem">Produits : classe 7. Charges : classe 6. Hors activités ordinaires : comptes 81 à 88 (cessions, charges et produits HAO). Impôt sur le résultat : compte 89. Agrégation simple des activités, sans élimination des opérations entre activités.</p></div>`;

    /* Immo : résultat par division */
    const divs = {}; DONNEES.immo.ecr.forEach(e => { if (e.division) divs[e.division] = 1; });
    const ids = Object.keys(divs);
    if (ids.length) {
      h += `<h2>Menko Immo — résultat par division, exercice ${esc(an)}</h2><div class="card"><div class="tw"><table><thead><tr><th>Division</th><th class="n">Produits</th><th class="n">Charges</th><th class="n">Résultat net</th></tr></thead><tbody>`
        + ids.map(id => { const r = resultat(DONNEES.immo.ecr, an, e => e.division === id); return `<tr><td>${esc(DONNEES.divNom[id] || id)}</td><td class="n">${fcfa(r.ord_p + r.hao_p)}</td><td class="n">${fcfa(r.ord_c + r.hao_c + r.impot)}</td><td class="n ${r.net < 0 ? 'neg' : r.net > 0 ? 'pos' : ''}">${fcfa(r.net)}</td></tr>`; }).join('')
        + `</tbody></table></div><p class="mu" style="margin-top:.6rem">Écritures rattachées à une division. Les écritures sans division ne figurent pas ici.</p></div>`;
    }
  } else h += `<div class="vide">Aucune écriture sur cet appareil : le résultat s'affichera dès que les applications auront comptabilisé des opérations.</div>`;

  /* Anomalies (liste bornée) */
  const liste = [];
  ACTIVITES.forEach(a => { const r = A[a.k]; [].concat(r.desequilibres, r.sansCompte, r.hors, r.montantNul, r.dateKo).forEach(x => liste.push(Object.assign({ act:a.nom }, x))); });
  if (liste.length) {
    h += `<h2>Écritures à corriger</h2><div class="card"><div class="tw"><table><thead><tr><th>Activité</th><th>Date</th><th>Libellé</th><th>Anomalie</th></tr></thead><tbody>`
      + liste.slice(0, 50).map(x => `<tr><td>${esc(x.act)}</td><td class="n">${esc(x.date || '—')}</td><td>${esc(x.libelle)}</td><td>${esc(x.detail)}</td></tr>`).join('')
      + `</tbody></table></div>${liste.length > 50 ? `<p class="mu" style="margin-top:.6rem">${liste.length - 50} autre(s) anomalie(s) non affichée(s). Corriger les premières, puis recharger.</p>` : ''}<p class="mu" style="margin-top:.6rem">La correction se fait dans l'application concernée (contre-passation), jamais ici.</p></div>`;
  }

  h += `<h2>Plan comptable commun</h2><div class="card"><p class="mu">Les activités appliquent le plan comptable SYSCOHADA révisé (classes 1 à 9). Un compte vide, ou qui ne commence pas par un chiffre de 1 à 9, est signalé « hors plan ». Chaque activité garde ses comptes personnalisés.</p></div>`;

  $('app').innerHTML = h;
  const sel = $('sel-an'); if (sel) sel.addEventListener('change', () => { DONNEES.annee = sel.value; rendre(); });
}

(async function init(){
  $('date').textContent = new Date().toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  if (!accesAutorise()) {
    $('app').innerHTML = '<div class="refus">Accès réservé. Connectez-vous au <a href="index.html">hub du groupe</a> avec un compte autorisé.</div>';
    return;
  }
  try { await charger(); rendre(); }
  catch(e) { $('app').innerHTML = '<div class="refus">Impossible de lire les écritures sur cet appareil. Rechargez la page ou rouvrez les applications.</div>'; }
})();
</script>
</body>
</html>
